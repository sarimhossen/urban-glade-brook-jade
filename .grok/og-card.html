<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Daily Dive share card</title>
<style>
  @font-face {
    font-family: "Lilita";
    src: url("fonts/LilitaOne-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #14281C;
  }
  body { font-family: "Lilita", sans-serif; position: relative; }
  svg.scene { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .lockup {
    position: absolute;
    left: 50%;
    top: 108px;
    transform: translateX(-50%);
    width: 860px;
    text-align: center;
    z-index: 2;
  }
  .daily, .dive {
    color: #D7E56C;
    -webkit-text-stroke: 12px #102016;
    paint-order: stroke fill;
    filter: drop-shadow(0 8px 0 #0a1610);
  }
  .daily {
    font-size: 124px;
    line-height: 0.84;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
  }
  .dive {
    margin-top: 2px;
    font-size: 248px;
    line-height: 0.76;
    letter-spacing: 0.02em;
    text-indent: 0.02em;
  }
  .tag {
    margin-top: 18px;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: #F7FBF4;
    -webkit-text-stroke: 6px #102016;
    paint-order: stroke fill;
  }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1F7A45" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1F7A45" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14281C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d9a5c"/>
      <stop offset="48%" stop-color="#1F7A45"/>
      <stop offset="100%" stop-color="#143222"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7F2E1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E7F2E1" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#14281C"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <polygon points="500,0 640,0 760,630 430,630" fill="url(#shaft)"/>
  <polygon points="560,0 610,0 640,630 520,630" fill="#E7F2E1" opacity="0.05"/>

  <g fill="#1F7A45">
    <g transform="translate(78,70) rotate(-16)">
      <path d="M0 0 C 8 90, -6 210, 6 390" fill="none" stroke="#1F7A45" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-34" cy="70" rx="42" ry="15" transform="rotate(-36 -34 70)"/>
      <ellipse cx="36" cy="118" rx="46" ry="16" transform="rotate(32 36 118)"/>
      <ellipse cx="-40" cy="176" rx="48" ry="16" transform="rotate(-34 -40 176)"/>
      <ellipse cx="38" cy="232" rx="50" ry="17" transform="rotate(30 38 232)"/>
      <ellipse cx="-36" cy="292" rx="44" ry="15" transform="rotate(-28 -36 292)"/>
      <ellipse cx="30" cy="346" rx="38" ry="14" transform="rotate(26 30 346)"/>
    </g>
    <g transform="translate(1122,86) rotate(14) scale(-1,1)">
      <path d="M0 0 C 8 80, -6 190, 6 360" fill="none" stroke="#1F7A45" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-32" cy="64" rx="40" ry="14" transform="rotate(-34 -32 64)"/>
      <ellipse cx="34" cy="112" rx="44" ry="15" transform="rotate(30 34 112)"/>
      <ellipse cx="-38" cy="168" rx="46" ry="16" transform="rotate(-32 -38 168)"/>
      <ellipse cx="36" cy="226" rx="48" ry="16" transform="rotate(28 36 226)"/>
      <ellipse cx="-30" cy="286" rx="40" ry="14" transform="rotate(-26 -30 286)"/>
    </g>
  </g>

  <ellipse cx="600" cy="588" rx="430" ry="70" fill="#0e2218"/>
  <ellipse cx="600" cy="578" rx="390" ry="56" fill="url(#pool)"/>
  <ellipse cx="600" cy="566" rx="230" ry="28" fill="none" stroke="#E7F2E1" stroke-width="3" opacity="0.55"/>
  <ellipse cx="600" cy="576" rx="310" ry="40" fill="none" stroke="#D7E56C" stroke-width="3" opacity="0.5"/>
  <ellipse cx="470" cy="568" rx="40" ry="10" fill="#E7F2E1" opacity="0.16"/>

  <g fill="#D7E56C">
    <ellipse cx="250" cy="150" rx="16" ry="8" transform="rotate(-28 250 150)" opacity="0.9"/>
    <ellipse cx="930" cy="188" rx="18" ry="8" transform="rotate(22 930 188)" opacity="0.85"/>
    <ellipse cx="300" cy="430" rx="13" ry="6" transform="rotate(18 300 430)" opacity="0.7"/>
    <ellipse cx="900" cy="400" rx="14" ry="6" transform="rotate(-20 900 400)" opacity="0.75"/>
  </g>
  <g fill="#E7F2E1">
    <ellipse cx="210" cy="250" rx="11" ry="5" transform="rotate(16 210 250)" opacity="0.7"/>
    <ellipse cx="990" cy="300" rx="12" ry="5" transform="rotate(-24 990 300)" opacity="0.65"/>
  </g>

  <g transform="translate(1040,168)">
    <path d="M-26 18 C -8 8, 8 8, 26 18" fill="none" stroke="#F7FBF4" stroke-width="7" stroke-linecap="round"/>
    <circle cy="0" r="13" fill="#F7FBF4"/>
    <rect x="-8" y="-4" width="16" height="7" rx="3.5" fill="#D7E56C"/>
    <path d="M-9 14 Q 0 58 0 78 Q 0 58 9 14 Z" fill="#E7F2E1"/>
    <path d="M-16 70 L 0 92 L 16 70 Z" fill="#1F7A45"/>
  </g>

  <rect width="1200" height="630" filter="url(#grain)" opacity="0.07"/>
</svg>
<div class="lockup">
  <div class="daily">DAILY</div>
  <div class="dive">DIVE</div>
  <div class="tag">ONE POOL A DAY</div>
</div>
</body>
</html>
